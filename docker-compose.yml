networks:
  hashinet:
    external: true

services:
  consul-dc1-server:
    image: hashicorp/consul:1.19
    container_name: consul-dc1-server
    hostname: consul-dc1-server
    networks: [hashinet]
    command: agent -config-file=/consul/config/dc1-server.hcl
    volumes:
      - ./consul/dc1-server.hcl:/consul/config/dc1-server.hcl:ro
    ports:
      - "8500:8500"

  consul-dc2-server:
    image: hashicorp/consul:1.19
    container_name: consul-dc2-server
    hostname: consul-dc2-server
    networks: [hashinet]
    command: agent -config-file=/consul/config/dc2-server.hcl
    volumes:
      - ./consul/dc2-server.hcl:/consul/config/dc2-server.hcl:ro
    ports:
      - "8501:8500"

  nomad-dc1-server:
    image: hashicorp/nomad:1.8
    container_name: nomad-dc1-server
    hostname: nomad-dc1-server
    networks: [hashinet]
    command: agent -config=/nomad/config/dc1-server.hcl
    volumes:
      - ./nomad/dc1-server.hcl:/nomad/config/dc1-server.hcl:ro
      - ./nomad/jobs:/nomad/jobs:ro
    cap_add: ["IPC_LOCK"]
    ports:
      - "4646:4646"
    depends_on: [consul-dc1-server]

  nomad-dc2-server:
    image: hashicorp/nomad:1.8
    container_name: nomad-dc2-server
    hostname: nomad-dc2-server
    networks: [hashinet]
    command: agent -config=/nomad/config/dc2-server.hcl
    volumes:
      - ./nomad/dc2-server.hcl:/nomad/config/dc2-server.hcl:ro
      - ./nomad/jobs:/nomad/jobs:ro
    cap_add: ["IPC_LOCK"]
    ports:
      - "4647:4646"
    depends_on: [consul-dc2-server]

  nomad-dc1-client:
    image: local/nomad-client:1.8.4
    container_name: nomad-dc1-client
    hostname: nomad-dc1-client
    networks: [hashinet]
    command: ["agent", "-config=/nomad/config/dc1-client.hcl"]
    environment:
      - NOMAD_SKIP_DOCKER_IMAGE_WARN=1
    volumes:
      - ./nomad/dc1-client.hcl:/nomad/config/dc1-client.hcl:ro
      - ./nomad/data-dc1:/nomad/data
      - /opt/cni/bin:/opt/cni/bin:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker:/var/run/docker:rshared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroup: host
    depends_on: [nomad-dc1-server]

  nomad-dc2-client:
    image: local/nomad-client:1.8.4
    container_name: nomad-dc2-client
    hostname: nomad-dc2-client
    networks: [hashinet]
    command: ["agent", "-config=/nomad/config/dc2-client.hcl"]
    environment:
      - NOMAD_SKIP_DOCKER_IMAGE_WARN=1
    volumes:
      - ./nomad/dc2-client.hcl:/nomad/config/dc2-client.hcl:ro
      - ./nomad/data-dc2:/nomad/data
      - /opt/cni/bin:/opt/cni/bin:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker:/var/run/docker:rshared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroup: host
    depends_on: [nomad-dc2-server]

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    networks: [hashinet]
    environment:
      - POSTGRES_USER=vaultadmin
      - POSTGRES_PASSWORD=supersecretadminpass
      - POSTGRES_DB=appdb
    ports:
      - "5432:5432"

  vault-server:
    image: hashicorp/vault:1.17
    container_name: vault-server
    hostname: vault-server
    networks: [hashinet]
    cap_add: ["IPC_LOCK"]
    command: server
    volumes:
      - ./vault/vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./vault/data:/vault/data
    ports:
      - "8300:8200"
